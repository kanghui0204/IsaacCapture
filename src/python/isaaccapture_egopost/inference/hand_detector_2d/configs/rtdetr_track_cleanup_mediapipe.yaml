# rtdetr_track_cleanup.yaml plus the MediaPipe hand-landmark check. Needs the
# OpenCV Zoo model handpose_estimation_mediapipe_2023feb.onnx (Apache-2.0, not
# bundled): export MEDIAPIPE_HAND_WEIGHTS=/path/to/that/file. Live detection
# only; run_hand_detector.py rejects mediapipe_check.
# See ../README.md#check-new-hands-with-mediapipe-optional.
detector_backend: rtdetr
rtdetr_config:
  # Offline post-filter; set false to retain the previous native boxes.
  bbox_smoothing: true
  bbox_size_scale: 0.8
  bbox_size_alpha_grow: 0.12
  bbox_size_alpha_shrink: 0.06
  bbox_max_size_change: 0.01
tracking: true
track_cleanup:
  sides_by_position: true
  drop_off_screen: true
  score_hysteresis: true
  constant_velocity: true
  gap_bridge: true
  containment_nms: true
  sides_per_tracklet: true
  mediapipe_check: true            # new and low-score hands must look like a hand
  mediapipe_skip_reacquired: true  # ... unless the hand was tracked there just before
  mediapipe_skip_fast: true        # ... or moves fast (motion blur)
  mediapipe_weights: "${MEDIAPIPE_HAND_WEIGHTS}"
